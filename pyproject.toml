[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "raqib"
version = "0.1.0"
description = "Audio & video moderation for calls, streams and recordings: flags harmful frames and speech with local models or any AI provider."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Faisal Alamoudi" }]
requires-python = ">=3.10"
keywords = ["moderation", "trust-and-safety", "content-moderation", "nsfw", "speech-to-text", "arabic", "onnx", "whisper"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Video",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "pillow>=10",
  "onnxruntime>=1.18",
  "tokenizers>=0.19",
  "huggingface_hub>=0.23",
  "faster-whisper>=1.1",
  "av>=12",
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.optional-dependencies]
gpu = ["onnxruntime-gpu>=1.18"]
dev = ["pytest>=8"]

[project.scripts]
raqib = "raqib.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["raqib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
